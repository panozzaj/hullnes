[project]
name = "hullnes"
version = "0.1.0"
description = "An NES CPU compiled into a vanilla transformer with 2D hardmax attention heads (Percepta-style), decoded with an O(log n) line-envelope cache"
requires-python = ">=3.12"
dependencies = ["numpy", "numba", "pillow"]

[dependency-groups]
dev = ["pytest", "py65"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hullnes", "third_party/nesformer", "third_party/chipformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
